name: Build CLAP Plugin

on:
  push:
    branches: [ main, feat/clap-daw-plugin ]
    paths:
      - 'packages/clap-plugin/**'
      - '.github/workflows/clap-plugin.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/clap-plugin/**'
      - '.github/workflows/clap-plugin.yml'
  workflow_dispatch: # Allow manual triggers

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: libstrudel_clap_plugin.so

          - name: Windows x86_64
            os: ubuntu-latest  # Cross-compile from Linux
            target: x86_64-pc-windows-gnu
            artifact: strudel_clap_plugin.dll

          # - name: macOS x86_64
          #   os: macos-latest
          #   target: x86_64-apple-darwin
          #   artifact: libstrudel_clap_plugin.dylib
          #
          # - name: macOS ARM64
          #   os: macos-latest
          #   target: aarch64-apple-darwin
          #   artifact: libstrudel_clap_plugin.dylib

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libjack-jackd2-dev \
            mingw-w64 \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libgl1-mesa-dev

      - name: Configure cross-compilation (Windows)
        if: matrix.platform.target == 'x86_64-pc-windows-gnu'
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          ar = "x86_64-w64-mingw32-ar"
          EOF

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/clap-plugin/target/
          key: ${{ runner.os }}-cargo-${{ matrix.platform.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.platform.target }}-
            ${{ runner.os }}-cargo-

      - name: Build plugin (debug)
        working-directory: packages/clap-plugin
        run: cargo build --target ${{ matrix.platform.target }}

      - name: Build plugin (release)
        working-directory: packages/clap-plugin
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Run tests
        if: matrix.platform.target == 'x86_64-unknown-linux-gnu'
        working-directory: packages/clap-plugin
        run: cargo test --target ${{ matrix.platform.target }}

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp packages/clap-plugin/target/${{ matrix.platform.target }}/release/${{ matrix.platform.artifact }} artifacts/

          # Create a README for the artifact
          cat > artifacts/README.txt << EOF
          Strudel CLAP Plugin - ${{ matrix.platform.name }}
          Built: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Commit: ${{ github.sha }}
          Target: ${{ matrix.platform.target }}

          Installation:
          EOF

          if [[ "${{ matrix.platform.target }}" == *"linux"* ]]; then
            echo "  Copy to: ~/.clap/Strudel.clap" >> artifacts/README.txt
          elif [[ "${{ matrix.platform.target }}" == *"windows"* ]]; then
            echo "  Rename to: Strudel.clap" >> artifacts/README.txt
            echo "  Copy to: C:\\Program Files\\Common Files\\CLAP\\" >> artifacts/README.txt
          elif [[ "${{ matrix.platform.target }}" == *"darwin"* ]]; then
            echo "  Copy to: ~/Library/Audio/Plug-Ins/CLAP/Strudel.clap" >> artifacts/README.txt
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: strudel-clap-${{ matrix.platform.target }}
          path: artifacts/
          retention-days: 30

  # Optional: Create a release when a tag is pushed
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        run: |
          cd artifacts
          for dir in */; do
            platform="${dir%/}"
            cd "$platform"
            zip -r "../${platform}.zip" .
            cd ..
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*.zip
          body: |
            ## Strudel CLAP Plugin Release

            ### Downloads
            - **Linux**: `strudel-clap-x86_64-unknown-linux-gnu.zip`
            - **Windows**: `strudel-clap-x86_64-pc-windows-gnu.zip`

            ### Installation
            See README.txt in each archive for installation instructions.

            ### Changelog
            - See commit history for changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Summary job to check overall status
  build-status:
    name: Build Status
    needs: build
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check build results
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ One or more builds failed"
            exit 1
          else
            echo "✅ All builds successful!"
          fi
